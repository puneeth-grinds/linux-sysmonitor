name: Docker Build and Push

on:
  workflow_call:
    inputs:
      image-tag:
        required: true
        type: string

      push:
        required: false
        default: false
        type: boolean

    secrets:
      REGISTRY_TOKEN:
        required: true

env:
  REGISTRY: ghcr.io

jobs:
  docker-build-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Fetch repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ inputs.push }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/linux-sysmonitor:${{ inputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: List Docker Images
        run: docker images

      - name: Pull Docker Image
        run: docker pull ${{ env.REGISTRY }}/${{ github.repository }}/linux-sysmonitor:${{ inputs.image-tag }}