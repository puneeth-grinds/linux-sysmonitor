name: CI Pipeline

on: 
  [ push,pull_request ]

permissions:
  contents: read
  packages: write 

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: fetch repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0

      - name: cache
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ hashFiles('**/Dockerfile') }}
          restore-keys: ${{ runner.os }}-apt-

      - name: cache miss
        if: ${{ steps.apt-cache.outputs.cache-hit != 'true' }}
        run: echo "cache miss"
      
      - name: cache hit
        if: ${{ steps.apt-cache.outputs.cache-hit == 'true' }}
        run: echo "cache hit"
      
      - name: install shell-check
        run: sudo apt install shellcheck

      - name: run shellcheck
        run: shellcheck linux-sysmonitor/health-check.sh
  
  test:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ ubuntu-24.04, ubuntu-22.04 ] 
    runs-on: ${{ matrix.os }}

    needs: lint

    steps:
      - name: fetch repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0

      - name: execute health-check.sh
        run: bash linux-sysmonitor/health-check.sh >  health-report-$(date +%Y%m%d-%H%M%S).txt 2>&1

      - name: upload report to artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: health-report
          path: health-report-*.txt
          retention-days: 7
  
  build:
    needs: [ lint, test ]
    uses: ./.github/workflows/docker-build-push.yml 
    with:
      image-tag: ${{ github.sha }}
      push: true
    secrets: inherit
  
  scan:
    runs-on: ubuntu-24.04
    needs: build

    permissions:
      security-events: write
    
    steps:
      - name: ghcr login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: pull docker image 
        run: docker pull ${{ env.REGISTRY }}/${{ github.repository }}/linux-sysmonitor:${{ github.sha }}
      
      - name: aquasecurity scan 
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/linux-sysmonitor:${{ github.sha }}
          # exit-code: 1 # TODO: Re-enable `exit-code: 1` after fixing CRITICAL vulnerabilities.
          severity: CRITICAL
      
      - name: generate trivy sarif report
        # if: always() - TODO: uncomment when exit-code:1 is enabled 
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/linux-sysmonitor:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
      
      - name: sarif upload
        # if: always() - TODO: uncomment when exit-code:1 is enabled
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-scan-analysis

  deploy-staging:
    needs: scan
    runs-on: ubuntu-24.04
    environment: staging

    steps:
      - name: run echo
        run: echo $"{{ vars.DEPLOY_URL }}"
    

