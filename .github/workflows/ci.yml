name: CI Pipeline

on: 
  [ push,pull_request ]

permissions:
  contents: read
  packages: write 

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: fetch repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0

      - name: install shell-check
        run: sudo apt install shellcheck

      - name: run shellcheck
        run: shellcheck linux-sysmonitor/health-check.sh
  
  test:
    runs-on: ubuntu-24.04
    needs: lint

    steps:
      - name: fetch repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0

      - name: execute health-check.sh
        run: bash linux-sysmonitor/health-check.sh >  health-report-$(date +%Y%m%d-%H%M%S).txt 2>&1

      - name: upload report to artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: health-report
          path: health-report-*.txt
          retention-days: 7
  
  build:
    runs-on: ubuntu-24.04
    needs: [ lint, test ]

    steps:
      - name: fetch repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0

      - name: build image 
        run: docker build -t ghcr.io/${{ github.repository }}/linux-sysmonitor:${{ github.sha }} .
      
      - name: latest-tag
        if: github.ref == 'refs/heads/main'
        run: docker tag ghcr.io/${{ github.repository }}/linux-sysmonitor:${{ github.sha }} ghcr.io/${{ github.repository }}/linux-sysmonitor:latest
      
      - name: run docker images
        run: docker images 
      
      - name: docker login 
        uses: docker/login-action@v3 
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.WORKFLOW_TOKEN}}
