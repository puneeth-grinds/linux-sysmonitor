volumes:
  sysmonitor_logs:

services:
  sysmonitor:
    build: 
      context: .
    image: linux-sysmonitor:v2
    volumes:
      - sysmonitor_logs:/app/logs
    environment:
      - LOG_LEVEL=INFO
      - CHECK_INTERVAL=60
      - TARGET_HOST=webserver
    depends_on:
      - webserver
    # restart: unless-stopped 
    # Enable this after health-check.sh is converted to a long-running monitoring service.
  webserver:
    image: nginx:alpine